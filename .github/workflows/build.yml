name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions: { contents: write }  # needed to attach the APK to a release
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: java -ea app/src/main/java/dev/hepta/tvcat/Streak.java
      - run: ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk hepta-tv-cat.apk
      - uses: actions/upload-artifact@v4
        with: { name: hepta-tv-cat, path: hepta-tv-cat.apk }
      # ponytail: signed with the checked-in app/debug.keystore, so every release updates in place.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: hepta-tv-cat.apk }
